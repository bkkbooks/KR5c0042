front:
  text: 老子像名經卷之十女十四爾時高上老子吿下方保命眞人及諸仙衆下方梵氣無極世界一百二十天尊靈像名號禮之者滅無量罪得無量福
  hash: sha256:034d3ab441e6e2f4277c4641825c9f4f30c3f2a2e78301d33a10531c7db14194
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0042_HFL_007-001a, image: hfl/0345/0345-094.png}
body:
  text: 至心信禮下方還魂起死天尊至心信禮妙寳上眞天尊至心信禮開明祖劫天尊至心信禮普植化生天尊至心信禮上極妙容天尊至心信禮梵氣普生天尊至心信禮周回度世天尊至心信禮上生保命天尊至心信禮大慈延壽天尊至心信禮圓寂證空天尊至心信禮嚴校主録天尊至心信禮削除罪讁天尊至心信禮威權自在天尊至心信禮超淩上界天尊至心信禮垂神濟物天尊至心信禮舟航苦海天尊至心信禮保舉監生天尊至心信禮圓明智勝天尊至心信禮無我慧通天尊至心信禮縁慈親善天尊至心信禮威制羣魔天尊至心信禮乘眞御運天尊至心信禮景化凝玄天尊至心信禮示見萬像天尊至心信禮還源歸寂天尊至心信禮安樂保常天尊至心信禮全生護命天尊至心信禮主録保年天尊至心信禮安鎮含識天尊至心信禮回靈養素天尊至心信禮開度宿障天尊至心信禮保命受生天尊至心信禮壽窮劫量天尊至心信禮流演萬範天尊至心信禮運度八威天尊至心信禮梵景金眞天尊至心信禮一氣元綱天尊至心信禮太皇鬱秀天尊至心信禮報願生因天尊至心信禮混合萬靈天尊至心信禮玄會八冥天尊至心信禮高眞上智天尊至心信禮浩劫玉虛天尊至心信禮流津布氣天尊至心信禮總持衆行天尊至心信禮元梵度人天尊至心信禮洞幽凝寂天尊至心信禮天眞太妙天尊至心信禮乘願往生天尊至心信禮慧覺通元天尊至心信禮太極妙成天尊至心信禮招眞會聖天尊至心信禮定光景耀天尊至心信禮觀明大度天尊至心信禮眞要匠導天尊至心信禮龍章萬變天尊至心信禮威光玄感天尊至心信禮觀縁品景天尊至心信禮玉眞梵景天尊至心信禮太明七耀天尊至心信禮玄素蒞光天尊至心信禮景德冲用天尊至心信禮巡虚飛步天尊至心信禮十華上願天尊至心信禮大安梵度天尊至心信禮虛明總監天尊至心信禮神眞妙用天尊至心信禮周濟忘功天尊至心信禮玉明玄覺天尊至心信禮梵氣彌羅天尊至心信禮通玄萬範天尊至心信禮十聖回輪天尊至心信禮長生護度天尊至心信禮普修萬行天尊至心信禮延和正化天尊至心信禮廣運慈善天尊至心信禮善濟智成天尊至心信禮遍空懸解天尊至心信禮玄樞冥寂天尊至心信禮空慧弘通天尊至心信禮洞虚會聖天尊至心信禮建德眀和天尊至心信禮常善救物天尊至心信禮妙樂無等天尊至心信禮契寂昇玄天尊至心信禮興弘德化天尊至心信禮崇仙尚善天尊至心信禮敬愛慈忍天尊至心信禮開濟四生天尊至心信禮弘宣廣廕天尊至心信禮上德普聞天尊至心信禮玉華流潤天尊至心信禮大忘辯智天尊至心信禮明空照寂天尊至心信禮通慧正信天尊至心信禮澄神靜域天尊至心信禮赴感被縁天尊至心信禮一乘觀照天尊至心信禮至眞玄本天尊至心信禮洞淵三昧天尊至心信禮六度大通天尊至心信禮混元祖劫天尊至心信禮凝虚太妙天尊至心信禮冥根弘濟天尊至心信禮大悲化遠天尊至心信禮愍念淪墜天尊至心信禮哀救人天天尊至心信禮超登浩劫天尊至心信禮迥出三清天尊至心信禮大羅凝湛天尊至心信禮至妙尊勝天尊至心信禮虛極大通天尊至心信禮玄宗空解天尊至心信禮妙勝周應天尊至心信禮通幽證極天尊至心信禮遍化世界天尊至心信禮開元應聖天尊至心信禮上善玉華天尊至心信禮寳眞常樂天尊至心信禮功成息照天尊高上老子曰如是天尊衆相圓滿左右侍衛無量徒衆並處下方梵氣無極世界之中廣演大乘敷說道要度脱一切有罪衆生令其離苦咸使安樂爾時高上老子吿下方保命眞人及諸仙衆汝等若能道化下方無極世界一切衆生讚歎下方梵氣無極世界一百二十天尊靈像名號能滅衆生生死報對從來所犯棄擲經書輕毁聖文之罪先嘗齋食以貪口腹之罪奸邪婬妬分離骨肉之罪擅用三寳竹木種種法物之罪大斗重秤方便侵人之罪出放販物過分求利之罪賣買孤虚欺誑賢良之罪惡口駡詈謗毁良賤比諸畜生之罪宰殺衆生屠割物命之罪輕慢父母自愛妻兒之罪如是下方十惡之罪無量無邊不可記憶今能一心發露懺悔除此十罪不爲下方十直之神下元太一録其罪目上奏天曹命過之後不墮下方無極世界糞穢地獄之中長免臭處之苦後生人中快樂無量於是保命眞人及諸仙衆一心頂禮敬奉教言高上老子曰如是十方天尊皆是元始應氣生死十方安鎮國土教導衆生隨其縁感散影分身變見無窮與劫輪轉隱顯不恒開度一切福被萬天若道士女冠及諸男女能發善心爲人主國王父母妻子己身眷屬七祖九玄天下地上一切衆生隨其分力金銀珠玉瓦石銅鐵丹青繡畫造其形像布散十方遍滿國土禮拜供養立觀度人行道念誦散華然燈懺悔發願奉誡持齋見世安樂過去生天獲福無量不可思議若國主有灾日月勃蝕星辰失度水旱不調兆人疫癘兵革四興當於靈觀玄壇及以宫殿庭闕以萬二千燈作十重千二百盞開八方門使内外圓足光明朗徹然於其中晝夜禮懺散華燒香歸命十方一千一百六十靈像名號稱揚念誦建大寳齋放生布施立百高座講說三洞大乘妙經即得國土安樂天下太平若公侯牧伯一切人民有衆灾危亦當勤行見世昌熾七祖昇天免脱地獄長夜光明世世罔極長享無爲然燈之法亦可羅列十方千二百盞亦可大建寳輪上安萬二千燈亦可所在立之公侯以千庶人用百皆依此法夜則使燈光不絶晝則息之停散之日皆當廣設大齋行道讚歎言功諸天得福無量不可勝言於是十方眞人及諸徒衆一時稽首稱善而退老子像名經卷之十
