front:
  text: 老子像名經卷之一二同卷女十爾時高上老子與十方眞人十部威神無量等衆遊歷十方無極世界宣揚教化見諸衆生廣造十方諸惡重罪孤魂塗炭受諸苦惱出闇入明一死一生流曳十方地獄之中或墮東方風雷地獄或入南方爐炭地獄或在西方金鎚地獄或處北方寒冰地獄或落東北鑊湯地獄或墜東南銅柱地獄或陷西南屠割地獄或役西北火車地獄或投上方火坑地獄或沉下方糞穢地獄受種種之罪隨業不同身首糜碎分張異處晝夜拷掠無時暫停深愍衆生受如是苦今當說此十方天尊應化靈像一千一百六十名號欲令十方無極世界一切衆生敬禮稱揚悔過滅惡生福長善汝等衆頁各宜諦聽於是高上老子吿東方普濟眞人及諸仙衆東方九氣無極世界九十天尊靈像名號禮之者滅無量罪得無量福
  hash: sha256:da6374c1e11a4c655e36e8a1df165f4ef12665e41c905e2d9e254cac03f45338
