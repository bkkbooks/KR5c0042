body:
  text: 至心信禮東方普慈護國天尊至心信禮大忍無礙天尊至心信禮東華上相天尊至心信禮青宫演化天尊至心信禮仙靈妙寳天尊至心信禮含和虚極天尊至心信禮九天積善天尊至心信禮皇上眞老天尊至心信禮元靈隱耀天尊至心信禮金闕玉虚天尊至心信禮疑心玄應天尊至心信禮靈都大度天尊至心信禮玄靈至德天尊至心信禮高上太虚天尊至心信禮圓通妙極天尊至心信禮開明眞相天尊至心信禮寳勝元和天尊至心信禮法藏圓極天尊至心信禮玄明眞定天尊至心信禮衆智成滿天尊至心信禮金華上相天尊至心信禮眞行明因天尊至心信禮威光實際天尊至心信禮開通信悟天尊至心信禮慧解智明天尊至心信禮紫虚上極天尊至心信禮靈心普照天尊至心信禮惠源廣潤天尊至心信禮正覺垂訓天尊至心信禮眞智照極天尊至心信禮仙度妙寳天尊至心信禮紫陽靈應天尊至心信禮妙意無邊天尊至心信禮金光善慧天尊至心信禮玄虚眞行天尊至心信禮慧空度脱天尊至心信禮裝嚴玄覺天尊至心信禮靈感遍通天尊至心信禮虛皇降照天尊至心信禮妙極眞源天尊至心信禮玄應慧明天尊至心信禮寳相眞陽天尊至心信禮凝神湛照天尊至心信禮法雲普潤天尊至心信禮虛明遠覽天尊至心信禮法相圓滿天尊至心信禮妙意端嚴天尊至心信禮本際玄微天尊至心信禮冲眞寂照天尊至心信禮妙樂威光天尊至心信禮普照幽明天尊至心信禮法縁無盡天尊至心信禮隨機赴感天尊至心信禮正智玄虛天尊至心信禮慧目流光天尊至心信禮瓊華炳曜天尊至心信禮浮香遠覽天尊至心信禮飛雲廣覆天尊至心信禮普度樂王天尊至心信禮海空慧解天尊至心信禮慈悲與樂天尊至心信禮虛皇普濟天尊至心信禮法燈朗照天尊至心信禮高上太虛天尊至心信禮大悲拔苦天尊至心信禮上德慈救天尊至心信禮安住至樂天尊至心信禮玄和妙寳天尊至心信禮無爲定慧天尊至心信禮玄虚嚴淨天尊至心信禮慈悲善濟天尊至心信禮慧量應物天尊至心信禮裝嚴素德天尊至心信禮虚玄至極天尊至心信禮妙本自然天尊至心信禮慈悲救護天尊至心信禮無名寳相天尊至心信禮法雲垂廕天尊至心信禮慈恩廣化天尊至心信禮玄津普潤天尊至心信禮靈和善積天尊至心信禮大慧凝湛天尊至心信禮廣開戒定天尊至心信禮囑累法寳天尊至心信禮冥神洞照天尊至心信禮崇仙開化天尊至心信禮大弘正法天尊至心信禮法橋普度天尊至心信禮德藏包含天尊至心信禮權變應見天尊高上老子曰如是天尊衆相圓滿左右侍衛無量徒衆並處東方九氣無極世界之中廣演大乘敷說道要度脱一切有罪衆生令其離苦咸使安樂爾時高上老子吿東方普濟眞人及諸仙衆汝等若能導化十方無極世界一切衆生若男若女咸共歸誠至心敬禮稱揚讚歎東方九氣無極世界九十天尊靈像名號能滅衆生生死報對從來所犯傲忽三寳不生肅敬之罪違經破戒去善就惡之罪輕慢師主不依盟約之罪欺心負信違理不償之罪惡口非法呪詛駡詈之罪醉酒酗鬥淩忽公私之罪潜行謀惡陰賊害人之罪憎親愛疏嗔内喜外之罪讒毀善人牽入邪徑之罪損善長惡面從背違之罪如是東方十惡之罪無量無邊不可記憶今能一心發露懺悔願除此十罪者則不爲東方十直之神天帝使者録其罪目上奏天曹命過之後不墮東方無極世界風雷地獄之中生死身神當免雷霆霹靂之難後生人中快樂無極於是普濟眞人及諸仙衆一心頂禮敬奉教言老子像名經卷之一
