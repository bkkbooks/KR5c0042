seq: 3
front:
  text: 老子像名經卷之三四同卷女十一爾時高上老子吿西方慈悲頁人及諸仙衆西方七氣無極世界有七十天尊靈像名號禮之者滅無量罪得無量福
  hash: sha256:af7b6241545795c73813b98ac56a394ffb5e1024c4aff30527d2874a9ab455c5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0042_HFL_003-001a, image: hfl/0345/0345-024.png}
body:
  text: 至心信禮西方金映護魂天尊至心信禮西靈慧照天尊至心信禮西極顯眞天尊至心信禮玄眞九老天尊至心信禮上聖十華天尊至心信禮四虚普照天尊至心信禮眞元七映天尊至心信禮三素皓靈天尊至心信禮金門演教天尊至心信禮太華上極天尊至心信禮空洞虚皇天尊至心信禮玄光度世天尊至心信禮九空太素天尊至心信禮靈耀八景天尊至心信禮七覺照疑天尊至心信禮三素光明天尊至心信禮大洞景華天尊至心信禮無量眞如天尊至心信禮元和寳勝天尊至心信禮定光命録天尊至心信禮皓華素德天尊至心信禮妙寳淨光天尊至心信禮眞明虚極天尊至心信禮冲和靈應天尊至心信禮太玄高上天尊至心信禮虚極妙靈天尊至心信禮寳花元梵天尊至心信禮淨藏祕景天尊至心信禮宗師度脱天尊至心信禮玄素總德天尊至心信禮太華應運天尊至心信禮高皇玉帝天尊至心信禮勝光寳曜天尊至心信禮高聖玄景天尊至心信禮中皇眞際天尊至心信禮元洞玉晨天尊至心信禮高上太一天尊至心信禮至極明宫天尊至心信禮玉虚挺相天尊至心信禮總眞元洞天尊至心信禮流光應見天尊至心信禮玄覽照幽天尊至心信禮通遠深淵天尊至心信禮金容顯相天尊至心信禮垂形散景天尊至心信禮流光四朗天尊至心信禮洞元積感天尊至心信禮高玄總衆天尊至心信禮浩眀梵寳天尊至心信禮金光七素天尊至心信禮玉皇眞極天尊至心信禮玄上太微天尊至心信禮洞慧虛容天尊至心信禮明機流覽天尊至心信禮尋眞大洞天尊至心信禮凝神會聖天尊至心信禮眞玄太一天尊至心信禮淨滿保光天尊至心信禮大乘景德天尊至心信禮耀明高上天尊至心信禮普息縁照天尊至心信禮玉潤流輝天尊至心信禮上華元一天尊至心信禮六空洞府天尊至心信禮七變元和天尊至心信禮五劫開化天尊至心信禮含光祕景天尊至心信禮清都證極天尊至心信禮靈化洞空天尊至心信禮冲虚入妙天尊高上老子曰如是天尊衆相圓滿左右侍衛無量徒衆並處西方七氣無極世界之中廣演大乘敷說道要度脱一切有罪衆生令其離苦咸使安樂爾時高上老子吿西方慈悲眞人及諸仙衆汝等若能導化西方無極世界一切衆生若男若女咸共歸誠至心信禮稱揚讚歎西方七氣無極世界七十天尊靈像名號能滅衆生生死報對從來所犯言無信實詭誑之罪嫉妬他人勝己之罪恃其勢力欺淩貧賤之罪口善心惡面喜意嗔之罪巧文曲判枉抑直道之罪呵叱尊卑輕侮老病之罪傳人惡語以成嗔恨之罪五形不隱露於三光之罪無故嫌恨妄相責罰之罪言語調弄初喜後怒之罪如是西方十惡之罪無量無邊不可記憶今能一心發露懺悔除此十罪不爲西方十直之神録其罪目上奏天曹命過之後不墮西方無極世界金鎚鐵杖地獄之中生死身神長免鞭撻之患後生人中快樂無極於是慈悲眞人及諸仙衆一心頂禮信奉教言老子像名經卷之三
  hash: sha256:9da112456b693453e930c60ca5a97566efdc248a1f738e4926b18387a72b0f87
