front:
  text: 老子像名經卷之五女十二爾時高上老子告東北慈敬頁人及諸仙衆東北梵氣無極世界有一百二十天尊靈像名號禮之者滅無量罪得無量福
  hash: sha256:46d122f4ba6495e9101289b2804bf17bd640749de03b01c4493caa737c85c269
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0042_HFL_005-001a, image: hfl/0345/0345-042.png}
body:
  text: 至心信禮東北方慈忍救苦天尊至心信禮元靈高聖天尊至心信禮中皇太一天尊至心信禮梵氣彌綸天尊至心信禮黃庭太保天尊至心信禮三素洞神天尊至心信禮大哀慜苦天尊至心信禮霞光朗耀天尊至心信禮中玄正一天尊至心信禮黃房洞晏天尊至心信禮高上虛無天尊至心信禮玄微太寳天尊至心信禮黃庭九老天尊至心信禮靈威拔苦天尊至心信禮八明浩氣天尊至心信禮玄眞上景天尊至心信禮太皇勝妙天尊至心信禮靈光保命天尊至心信禮流光通導天尊至心信禮飛華慶善天尊至心信禮回光至極天尊至心信禮應像飛光天尊至心信禮無心妙體天尊至心信禮六度眞容天尊至心信禮興隆道相天尊至心信禮高眞觀妙天尊至心信禮流變延眞天尊至心信禮妙樂難勝天尊至心信禮元靈一氣天尊至心信禮玄靈八素天尊至心信禮眞老福慶天尊至心信禮青眞妙覺天尊至心信禮碧霞始老天尊至心信禮玄和淨德天尊至心信禮太空至德天尊至心信禮明眞四極天尊至心信禮自然虛極天尊至心信禮積慶元和天尊至心信禮廣運慈善天尊至心信禮萬福普䕶天尊至心信禮慈善廣濟天尊至心信禮明賢慈愛天尊至心信禮開度福道天尊至心信禮垂光慈廕天尊至心信禮八達常善天尊至心信禮六合通明天尊至心信禮開度憂惱天尊至心信禮乘烟太帝天尊至心信禮七元八會天尊至心信禮太丹三素天尊至心信禮元和寳相天尊至心信禮太眞高上天尊至心信禮瓊光靈耀天尊至心信禮通玄眞定天尊至心信禮中和善寂天尊至心信禮崇愛延光天尊至心信禮流光太明天尊至心信禮靈眞流梵天尊至心信禮太微至極天尊至心信禮景德太丹天尊至心信禮通光普照天尊至心信禮玄機妙應天尊至心信禮金眞流映天尊至心信禮玉光耀彩天尊至心信禮揮光振景天尊至心信禮滅魔度脱天尊至心信禮祕景長生天尊至心信禮通眞解滯天尊至心信禮垂光景耀天尊至心信禮太華定相天尊至心信禮内景含和天尊至心信禮通靈回化天尊至心信禮飛步九空天尊至心信禮步紀七元天尊至心信禮豁落長耀天尊至心信禮七耀延靈天尊至心信禮混成開化天尊至心信禮通明四洞天尊至心信禮啓明無極天尊至心信禮空玄眀梵天尊至心信禮太空玄隱天尊至心信禮靈都集慶天尊至心信禮景雲普被天尊至心信禮洞浮七耀天尊至心信禮靈光四照天尊至心信禮保命護魂天尊至心信禮洞空圓極天尊至心信禮演法開化天尊至心信禮丹華皓映天尊至心信禮流輝帝一天尊至心信禮洞啓幽玄天尊至心信禮玄普靈耀天尊至心信禮神光遠鑒天尊至心信禮紫庭會聖天尊至心信禮匠導衆眞天尊至心信禮廣運玄化天尊至心信禮靈源普潤天尊至心信禮崇眞演教天尊至心信禮安化太玄天尊至心信禮耀景棲眞天尊至心信禮寳耀洞明天尊至心信禮八景回晨天尊至心信禮圓景耀霞天尊至心信禮明光晨極天尊至心信禮靈源廣洽天尊至心信禮金光玄耀天尊至心信禮弘眞度物天尊至心信禮總御衆眞天尊至心信禮太霄耀景天尊至心信禮結朗重明天尊至心信禮啓眞玄素天尊至心信禮混化變生天尊至心信禮思玄會寂天尊至心信禮靈光皓映天尊至心信禮華光流耀天尊至心信禮慧源玄暢天尊至心信禮凝虚善寂天尊至心信禮法光寳相天尊至心信禮玄光普照天尊高上老子曰此天尊等並各身作眞金妙色項負飛艷圓光頭戴通天芙蓉七寳華冠建雲光流耀華簪體佩五雲雜色錦帔著丹霞流彩長裙足躡雙珠景光方履各與天龍猛卒地仙道士控制魔王護法眞人持地金剛天丁力士侍香玉童散花玉女五色師子負弩神王各爲十部羽從於是天尊乘虚步煙同遊東北無極世界之中廣度一切有罪衆生令入樂道各使得安爾時高上老子又吿東北慈敬眞人及諸仙衆曰卿等若能勸化東北無極世界一切善男子善女人悉令送心投款至心禮敬稱揚東北梵氣一百二十天尊靈像名號者則滅除存亡二代從來所犯張羅布網捕獵鳥獸之罪次滅好放鷹鸇遊捕衆生之罪次滅歲節告終屠殺六畜以供薦饗之罪次滅橫引清人以令入獄之罪次滅奪人恩愛分隔骨肉之罪次滅刺印奴婢面額以作痕迹之罪次滅敗人婚媾不使和合之罪次滅身體不淨觸突三寳之罪次滅笑人瘨癡風癇疾病之罪次滅批毛覓疵求人過惡之罪有此東北十惡之罪無量無邊不可測憶之罪今能彈指懺悔滅除此十罪者則不爲東北十直之神太一使者録其罪目上奏天曹則壽終命過之後不墮東北梵氣無極世界鑊湯地獄之中長免鑊湯爛煮之患五體完全六腑清淨紫房遊縱丹闕閑居若更生人中作人師範開化衆生令入法相此則上賴東北梵氣一百二十天尊之恩下副此等男女送心投款歸命之誠於是慈敬眞人及諸仙衆彈指頂禮敬奉教言老子像名經卷之五卷之六卷之七卷之八缺
