front:
  text: 老子像名經卷之四爾時高上老子吿北方救苦眞人及諸仙衆北方五氣無極世界有五十天尊靈像名號禮之者滅無量罪得無量福
  hash: sha256:63fe19808fbdb35c19751d62a09b895cf78543a6098d1a7ddb9e1504c1238840
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0042_HFL_004-001a, image: hfl/0345/0345-034.png}
body:
  text: 至心信禮北方延壽保命天尊至心信禮北極明耀天尊至心信禮玄虚太極天尊至心信禮紫度虛皇天尊至心信禮金眞應福天尊至心信禮瓊華十善天尊至心信禮玄微隱耀天尊至心敬禮高眞太寳天尊至心信禮玄和大度天尊至心信禮紫晨降福天尊至心信禮上慧弘慈天尊至心信禮寳寂幽源天尊至心信禮靈光正德天尊至心信禮還淳示像天尊至心信禮安神寂照天尊至心信禮紫極元君天尊至心信禮玄眞妙寳天尊至心信禮四達無礙天尊至心信禮六辨虛疑天尊至心信禮明暉景秀天尊至心信禮圓光炳耀天尊至心信禮金映流眞天尊至心信禮玄上紫虚天尊至心信禮太微極妙天尊至心信禮靈光空相天尊至心信禮無上景皇天尊至心信禮虚明洞慧天尊至心信禮寳玄流化天尊至心信禮澄神保劫天尊至心信禮妙智湛常天尊至心信禮五靈玄德天尊至心信禮罽賔闡化天尊至心信禮六度凝神天尊至心信禮高元上相天尊至心信禮普光弘濟天尊至心信禮凝玄高上天尊至心信禮耀景元和天尊至心信禮弘明寳相天尊至心信禮空慧無滯天尊至心信禮重光萬善天尊至心信禮含和遠暢天尊至心信禮遊虚常樂天尊至心信禮端嚴上德天尊至心信禮明霞通知天尊至心信禮乘眞導化天尊至心信禮靈化機感天尊至心信禮通玄釋滯天尊至心信禮德意無上天尊至心信禮虚皇演聖天尊至心信禮大哀廣濟天尊高上老子曰如是天尊衆相圓滿左右侍衛無量徒衆並處北方五氣無極世界之中廣演大乘敷說道要度脱一切有罪衆生令其離苦咸使安樂爾時高上老子告北方救苦眞人及諸仙衆汝等若能導化北方無極世界一切衆生若男若女咸共歸誠至心信禮稱揚讚歎北方五氣無極世界五十天尊靈像名號能滅衆生生死報對從來所犯殺他含血衆生之罪不肯施散營建功德之罪啖食衆生以爲滋味之罪鷹犬遊獵殺害衆生之罪放火燒山傷殺蠢蠕之罪見人疾病不生憐愍救治之罪要路掘坑墜人手足之罪恣施棘刺斷人要路行蹤之罪偷人妻子詃誘奴婢之罪盜人尊像鍾磬雜物之罪如是北方十惡之罪無量無邊不可記憶今能一心發露懺悔除此十罪不爲北方十直之神北斗司殺之鬼録其罪目上奏天曹命過之後不墜北方無極世界寒冰溟泠地獄之中長免露卧冰牀苦痛之患後生人中快樂無極於是救苦眞人及諸仙衆一心頂禮敬奉教言老子像名經卷之四
