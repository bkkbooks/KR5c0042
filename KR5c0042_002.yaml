seq: 2
front:
  text: 老子像名經卷之二爾時高上老子告南方普度真人及諸仙衆南方三氣無極世界有三十天尊靈像名號禮之者滅無量罪得無量福
  hash: sha256:b3ba1e71c761dc576b5e7684b45b443748f2ed3e46fb3e0e7ff5caa2d063c4fb
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0042_HFL_002-001a, image: hfl/0345/0345-018.png}
body:
  text: 至心信禮南方威德大慈天尊至心信禮炎光靈耀天尊至心信禮南極朱陵天尊至心信禮南上嚴淨天尊至心信禮無相長生天尊至心信禮丹靈定慧天尊至心信禮丹元光妙天尊至心信禮朱明法本天尊至心信禮慧命凝常天尊至心信禮威光度脫天尊至心信禮法身出世天尊至心信禮無礙自在天尊至心信禮巧説法相天尊至心信禮增益慧解天尊至心信禮善權化物天尊至心信禮至寂澄明天尊至心信禮智德無等天尊至心信禮太微應號天尊至心信禮玄通定相天尊至心信禮洞鑒幽明天尊至心信禮梵明弘教天尊至心信禮安樂勝報天尊至心信禮升玄至極天尊至心信禮妙光寶勝天尊至心信禮中和大慧天尊至心信禮一乘虛極天尊至心信禮玄宗誕應天尊至心信禮無量威化天尊至心信禮玄暉妙覺天尊至心信禮冥神洞晏天尊高上老子曰如是天尊衆相圓滿左右侍衛無量徒衆並處南方三氣無極世界之中廣演大乘敷説道要度脫一切有罪衆生令其離苦咸使安樂爾時高上老子告南方普度真人及諸仙衆汝等若能導化南方無極世界一切衆生若男若女咸共歸誠至心信禮稱揚讚歎南方三氣無極世界三十天尊靈像名號能滅衆生生死報對從來所犯誹謗頁經謂為邪説之罪忘師傳授不遵教誨之罪占候圖讖妄説吉凶之罪詃誘良善壓為奴婢之罪放情縱欲浪行非法之罪剝脫行人取其衣服之罪偷竊三寶常住法具之罪發掘冢墓劫剝死人之罪祕惜經書不肯傳授之罪妬人富有願令衰耗之罪如是南方十惡無量無邊之罪不可記憶今能一心發露懺悔除此十罪不為南方十直之神太一使者録其罪目上奏天曹命過之後不墮南方無極世界爐炭地獄之中生死身神長免灼爛苦痛之憂後生人中快樂無極於是普度頁人及諸仙衆一心頂禮信奉教言老子像名經卷之二
